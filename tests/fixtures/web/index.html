<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Remote MCP Browser Fixture</title>
  <style>
    :root { color-scheme: dark; background: #101318; color: #eef2f7; font-family: system-ui, sans-serif; }
    body { max-width: 800px; margin: 40px auto; padding: 24px; background: #171c24; }
    input, button, a { margin: 8px; padding: 10px; }
  </style>
</head>
<body>
  <h1>Browser fixture</h1>
  <label for="display-name">Display name</label>
  <input id="display-name" aria-label="Display name">
  <label for="secret-token">Secret token</label>
  <input id="secret-token" aria-label="Secret token" type="password" value="BROWSER_SECRET_CANARY">
  <button id="save" type="button">Save profile</button>
  <span id="status" role="status">Idle</span>
  <button id="popup" type="button">Open report</button>
  <a id="download" href="/download">Download report</a>
  <input id="upload" aria-label="Upload file" type="file">
  <pre id="upload-name"></pre>
  <script>
    document.querySelector('#save').addEventListener('click', () => {
      document.querySelector('#status').textContent = `Saved ${document.querySelector('#display-name').value}`;
    });
    document.querySelector('#popup').addEventListener('click', () => window.open('/popup', '_blank'));
    document.querySelector('#upload').addEventListener('change', (event) => {
      document.querySelector('#upload-name').textContent = event.target.files[0]?.name || '';
    });
  </script>
</body>
</html>
